# Reverse proxy in front of the read-only API. TLS certificates are your own to provide.
server {
    listen 443 ssl;
    server_name rules.example.invalid;           # placeholder

    ssl_certificate     /etc/ssl/certs/rules.pem;
    ssl_certificate_key /etc/ssl/private/rules.key;

    location / {
        limit_except GET { deny all; }           # read-only by design
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
}
